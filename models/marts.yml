version: 2

models:
  - name: fct_sales_line
    description: Fact table for sales lines
    columns:
      - name: sales_line_id
        tests:
          - unique
          - not_null

      - name: order_id
        tests:
          - not_null

      - name: product_id
        tests:
          - relationships:
              arguments: # Asegúrate de que haya 2 espacios aquí
                to: "{{ ref('dim_products') }}"
                field: product_id

      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: "{{ ref('dim_customers') }}"
                field: customer_id

      - name: date_key
        tests:
          - relationships:
              arguments: # Corregido: ahora alineado con los anteriores
                to: "{{ ref('dim_date') }}"
                field: date_key

      - name: channel_key
        tests:
          - relationships:
              arguments: # Corregido: ahora alineado con los anteriores
                to: "{{ ref('dim_channel') }}"
                field: channel_key

  - name: dim_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_customers
    columns:
      - name: customer_id # Cambiado de customer_key a customer_id para que el test de fct funcione
        tests:
          - unique
          - not_null

  - name: dim_channel
    columns:
      - name: channel_key
        tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique
          - not_null